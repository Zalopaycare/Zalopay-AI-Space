<!doctype html><html><head><meta charset="utf-8"><title>Zalopay AI Space intro 1080</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&display=block" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#04060d}
#b{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:radial-gradient(75% 75% at 50% 78%, #3f6dff 0%, #2a4fe0 28%, #1b33a8 55%, #10206a 78%, #0a1440 100%);}
#b .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:72px 72px;
  -webkit-mask-image:radial-gradient(70% 70% at 50% 45%,#000 30%,transparent 85%);mask-image:radial-gradient(70% 70% at 50% 45%,#000 30%,transparent 85%)}
#b .glow{position:absolute;left:50%;top:50%;width:1700px;height:900px;margin:-520px 0 0 -850px;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 55%,rgba(150,190,255,.45) 0%,rgba(60,120,255,.25) 40%,rgba(60,120,255,0) 75%);animation:glow 6s ease-in-out infinite}
#b .vign{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,30,.55) 0%,rgba(4,8,30,0) 30%,rgba(4,8,30,0) 75%,rgba(4,8,30,.35) 100%)}
.st{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 8px 1px rgba(200,225,255,.8);animation:twinkle 2s ease-in-out infinite}
.wm{position:absolute;left:50%;top:45%;width:320px;zoom:3.4;transform:translate(-50%,-62%)}
.horizon{position:absolute;left:50%;top:830px;width:3600px;height:3600px;margin-left:-1800px;border-radius:50%;background:radial-gradient(closest-side,#0b1650 96%,#1d3bb8 99%,#7fb0ff 100%);box-shadow:0 0 60px 14px rgba(110,170,255,.75),0 0 180px 60px rgba(60,120,255,.45),inset 0 30px 80px rgba(120,180,255,.35);opacity:0;animation:bdlight 4.4s forwards}
.tag{position:absolute;left:0;right:0;top:640px;text-align:center;font-family:"Be Vietnam Pro",sans-serif;font-size:34px;line-height:1.5;color:#dbe7ff;letter-spacing:.01em;text-shadow:0 2px 18px rgba(20,60,200,.6);opacity:0;animation:taglinein 4.4s forwards}
.tag b{font-weight:500;color:#fff}
.ufo-row{position:relative;width:320px;margin:0 auto;height:32px}
.ust{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.75);animation:twinkle 2s ease-in-out infinite}
.zp-ufo{position:absolute;left:55.5%;top:0;animation:ufopatrol 6s ease-in-out infinite}
.zp-beam{position:absolute;left:0;top:24px;width:84px;height:96px;transform:translateX(-50%);clip-path:polygon(50% 0%,100% 100%,0% 100%);
  background:linear-gradient(180deg,rgba(180,225,255,.5) 0%,rgba(140,200,255,.12) 65%,rgba(140,200,255,0) 100%);animation:beamflicker 2s ease-in-out infinite}
.logo{position:relative;width:320px;margin:0 auto}
.zp-logo-ting{position:relative;filter:drop-shadow(0 6px 40px rgba(26,95,255,.85)) drop-shadow(0 0 16px rgba(90,150,255,.6));animation:shine 6s ease-in-out infinite}
.zp-logo-ting img{display:block;width:100%;height:auto}
.zp-glint{position:absolute;left:58.4%;top:2%;margin:-7px 0 0 -7px;width:14px;height:14px;opacity:0;filter:drop-shadow(0 0 10px #bfe6ff) drop-shadow(0 0 22px #6fc3ff);animation:glint 6s ease-in-out infinite}
.ai{position:absolute;z-index:2}
.ai div{opacity:0;filter:drop-shadow(0 0 10px rgba(140,190,255,.55));animation:ailogoblink 6s ease-in-out infinite both}
.ai img{display:block;height:auto}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes ufopatrol{0%,100%{transform:translate(0,0)}25%{transform:translate(50px,-8px)}50%{transform:translate(0,0)}75%{transform:translate(-50px,-8px)}}
@keyframes beamflicker{0%,100%{opacity:.78}50%{opacity:1}}
@keyframes glint{0%,40%{opacity:0;transform:scale(0) rotate(0deg)}48%{opacity:1;transform:scale(1.3) rotate(45deg)}62%,100%{opacity:0;transform:scale(.3) rotate(90deg)}}
@keyframes shine{0%,38%,60%,100%{filter:brightness(1) drop-shadow(0 6px 40px rgba(26,95,255,.85)) drop-shadow(0 0 16px rgba(90,150,255,.6))}47%{filter:brightness(1.35) drop-shadow(0 6px 46px rgba(60,130,255,.95)) drop-shadow(0 0 20px rgba(140,190,255,.8))}}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes ailogoblink{0%{opacity:0;transform:scale(.6);filter:brightness(1) drop-shadow(0 0 10px rgba(140,190,255,.55))}10%{opacity:1;transform:scale(1.18);filter:brightness(2) drop-shadow(0 0 18px rgba(190,225,255,.95))}20%{opacity:1;transform:scale(1);filter:brightness(1) drop-shadow(0 0 10px rgba(140,190,255,.55))}55%{opacity:1;transform:scale(1)}85%,100%{opacity:0;transform:scale(.92)}}

/* ---- intro (same timeline as the Home page): 0–4.4s fly-in + reveal + flash, then the idle loop ---- */
.zp-ufo{animation:ufointro 4.4s forwards,ufopatrol 6s ease-in-out 4.4s infinite}
.zp-beam{animation:beamintro 4.4s forwards,beamflicker 2s ease-in-out 4.4s infinite}
.zp-logo-reveal{padding:60px 80px;margin:-60px -80px;animation:logoreveal 4.4s forwards}
.zp-logo-ting{animation:logoting 4.4s forwards}
.zp-flash{position:absolute;left:50%;top:50%;width:600px;height:220px;margin:-110px 0 0 -300px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(160,200,255,.5) 42%,rgba(80,140,255,0) 100%);opacity:0;animation:flashburst 4.4s forwards}
.zp-glint{animation:glintintro 4.4s forwards}
.ai div{animation-name:ailogoblink;animation-duration:4.8s}
.dim{position:absolute;inset:0;background:#02040f;opacity:.62;animation:undim 4.4s forwards}
.glow{animation:bdlight 4.4s forwards}
.fade{position:absolute;inset:0;background:#02040f;opacity:0;animation:fadeout 8s linear forwards}
.once .fade{display:none}
@keyframes ufointro{0%{left:-120%;animation-timing-function:cubic-bezier(.2,.7,.3,1)}27%{left:0%;animation-timing-function:linear}73%{left:100%;animation-timing-function:ease-in-out}100%{left:55.5%}}
@keyframes beamintro{0%,25%{opacity:0}29%,100%{opacity:1}}
@keyframes logoreveal{0%,27%{clip-path:inset(0 calc(100% - 80px) 0 0)}73%{clip-path:inset(0 80px 0 0)}74%,100%{clip-path:inset(0 0 0 0)}}
@keyframes logoting{0%,27%{filter:brightness(.06) drop-shadow(0 6px 40px rgba(26,95,255,0)) drop-shadow(0 0 16px rgba(90,150,255,0));transform:scale(1)}72%{filter:brightness(.6) drop-shadow(0 6px 40px rgba(26,95,255,0)) drop-shadow(0 0 16px rgba(90,150,255,0));transform:scale(1)}76%{filter:brightness(2.2) drop-shadow(0 6px 40px rgba(26,95,255,.85)) drop-shadow(0 0 16px rgba(90,150,255,.6));transform:scale(1.06)}88%,100%{filter:brightness(1) drop-shadow(0 6px 40px rgba(26,95,255,.85)) drop-shadow(0 0 16px rgba(90,150,255,.6));transform:scale(1)}}
@keyframes flashburst{0%,72%{opacity:0;transform:scale(.3)}76%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
@keyframes glintintro{0%,73%{opacity:0;transform:scale(0) rotate(0deg)}78%{opacity:1;transform:scale(1.3) rotate(45deg)}94%,100%{opacity:0;transform:scale(.3) rotate(90deg)}}
@keyframes undim{0%,72%{opacity:.62}77%,100%{opacity:0}}
@keyframes bdlight{0%,72%{opacity:0}77%,100%{opacity:1}}
@keyframes taglinein{0%,80%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
@keyframes fadeout{0%,93%{opacity:0}100%{opacity:1}}
